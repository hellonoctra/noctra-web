<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Noctra · Firma de correo</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  body{margin:0;background:#EDE6D8;color:#0C0B0A;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;}
  .wrap{max-width:640px;margin:0 auto;padding:48px 20px;}
  h1{font-family:Georgia,serif;font-weight:400;font-size:26px;margin:0 0 6px;}
  .help{font-size:14px;line-height:1.6;color:#5E584F;margin:0 0 28px;}
  .sheet{background:#fff;border:1px solid #B9B1A3;padding:28px;}
  button{margin-top:20px;font:inherit;font-size:12px;letter-spacing:2px;text-transform:uppercase;background:#8E2439;color:#EDE6D8;border:0;padding:12px 20px;cursor:pointer;}
  button:focus-visible{outline:2px solid #0C0B0A;outline-offset:2px;}
  .ok{margin-left:12px;font-size:13px;color:#5E584F;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Firma de correo</h1>
  <p class="help">Pulsa <b>Copiar firma</b> (o selecciona todo lo que está dentro del recuadro blanco y cópialo con ⌘C) y pégalo en el editor de firmas de tu correo.</p>

  <div class="sheet" id="firma">
<!-- firma: inicio -->
<table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:Georgia,'Times New Roman',serif;color:#0C0B0A;">
  <tr>
    <td style="padding:0 0 14px 0;">
      <a href="https://noctra.art" style="text-decoration:none;"><img src="https://noctra.art/firma-noctra.png" width="220" height="60" alt="NOCTRA" style="display:block;border:0;width:220px;height:60px;"></a>
    </td>
  </tr>
  <tr>
    <td style="padding:0;font-family:Georgia,'Times New Roman',serif;font-size:18px;line-height:24px;color:#0C0B0A;">Ale Luque</td>
  </tr>
  <tr>
    <td style="padding:2px 0 12px 0;font-family:Helvetica,Arial,sans-serif;font-size:10px;line-height:14px;letter-spacing:2px;text-transform:uppercase;color:#8E2439;">Estratega de contenido</td>
  </tr>
  <tr>
    <td style="padding:10px 0 0 0;border-top:1px solid #B9B1A3;font-family:Helvetica,Arial,sans-serif;font-size:12px;line-height:20px;color:#5E584F;">
      <a href="mailto:hello@noctra.art" style="color:#0C0B0A;text-decoration:none;">hello@noctra.art</a>
      &nbsp;·&nbsp;
      <a href="https://noctra.art" style="color:#0C0B0A;text-decoration:none;">noctra.art</a>
      &nbsp;·&nbsp;
      <a href="https://instagram.com/noctra.brandco" style="color:#0C0B0A;text-decoration:none;">@noctra.brandco</a>
    </td>
  </tr>
  <tr>
    <td style="padding:6px 0 0 0;font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:13px;line-height:18px;color:#5E584F;">La forma correcta de ser visto.</td>
  </tr>
</table>
<!-- firma: fin -->
  </div>

  <button type="button" id="copiar">Copiar firma</button><span class="ok" id="ok" aria-live="polite"></span>
</div>
<script>
document.getElementById('copiar').addEventListener('click', function(){
  var el = document.getElementById('firma');
  var ok = document.getElementById('ok');
  var sel = window.getSelection(), range = document.createRange();
  range.selectNodeContents(el);
  sel.removeAllRanges(); sel.addRange(range);
  var done = false;
  try { done = document.execCommand('copy'); } catch(e) {}
  ok.textContent = done ? 'Copiada. Pégala en tu correo.' : 'Selecciona la firma y cópiala con ⌘C.';
  if(done) sel.removeAllRanges();
});
</script>
</body></html>
